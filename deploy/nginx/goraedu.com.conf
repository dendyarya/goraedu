# /etc/nginx/sites-available/goraedu.com  (production; other sites on this VPS untouched)
# Cloudflare proxies the domain (SSL mode "Full (strict)"); this server answers with the
# Cloudflare Origin Certificate. The site lives on https://www.goraedu.com; the bare domain and plain HTTP
# redirect there.
# Static site: Nginx serves the active release directly, no app server.

server {
    listen 80;
    listen [::]:80;
    server_name goraedu.com www.goraedu.com;
    return 301 https://www.goraedu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name goraedu.com;
    ssl_certificate     /etc/ssl/goraedu/origin.pem;
    ssl_certificate_key /etc/ssl/goraedu/origin.key;
    return 301 https://www.goraedu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.goraedu.com;

    ssl_certificate     /etc/ssl/goraedu/origin.pem;
    ssl_certificate_key /etc/ssl/goraedu/origin.key;

    # visitor IPs from Cloudflare (file written by setup-vps.sh from cloudflare.com/ips-v4 and ips-v6)
    include /etc/nginx/snippets/gora-cloudflare-realip.conf;

    root /var/www/goraedu/production/current;
    index index.html;
    absolute_redirect off;   # /epa-608 -> /epa-608/ keeps https and the public host
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/gora-production.access.log;
    error_log  /var/log/nginx/gora-production.error.log;

    # security headers (runbook: Setup teknis)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # never serve release bookkeeping files
    location ~ ^/(MANIFEST\.sha256|RELEASE)$ { return 404; }

    # hashed build assets never change: cache for a year
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
